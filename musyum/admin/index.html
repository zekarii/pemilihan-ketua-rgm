<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman Panitia | Hasil Pungutan Suara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets-admin/admin.css">
<link rel="icon" type="image/ico" href="assets-admin/admin-favicon.ico">
</head>
<body>
<div class="bg-decoration"></div>
<main class="kertas">
  <h1>Hasil Pemilihan Ketua RGM | Panitia Musyum '26-27</h1>
  <p class="admin-subtitle">Dashboard Panitia Musyum 26-27</p>

  <div id="login">
    <input id="pw" type="password" placeholder="Masukkan password" aria-label="Gunakan password yang diberikan oleh koordinator PDD">
    <button id="btnMasuk">Masuk</button>
    <p class="err" id="err"></p>
  </div>

  <div id="isi" hidden>
    <div class="stat-box">
      <div class="stat-label">Total Suara</div>
      <div class="stat-number" id="total">0</div>
    </div>

    <div id="hasil"></div>

    <div class="alat">
      <button id="btnRefresh">🔄 Perbarui</button>
      <button id="btnReset" class="bahaya">⚠ Hapus Semua Suara</button>
    </div>

    <h2>Riwayat Pungutan Suara</h2>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Calon Yang Dipilih</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="assets-admin/admin.js"></script>
</body>
</html>
